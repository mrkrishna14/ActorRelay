    <path class="sym" d="M1990 632 H2180 L2210 660 L2180 688 H1990 Z"/>
    <path class="sym" d="M1990 810 H2180 L2210 838 L2180 866 H1990 Z"/>
    <text class="small" x="136" y="124">BOILER</text>
    <text class="small" x="2094" y="124">PLANT B</text>
    <text class="small" x="136" y="702">FEED</text>
    <text class="small" x="2094" y="672">RETURN</text>
    <text class="small" x="2094" y="850">PRODUCT</text>
