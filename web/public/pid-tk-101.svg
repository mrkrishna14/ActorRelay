<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1000" width="2800" height="1000" role="img" aria-labelledby="pid-title pid-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="pid-title">TK-101 hold tank piping and instrumentation diagram</title>
  <desc id="pid-desc">Simulated plant. Feed pump P-100 fills hold tank TK-101. Steam from header 1 passes control valve TV-101 into coil E-101, and condensate leaves through a steam trap. Outlet valve LV-101 drains the tank under level control LIC-101. TIC-101 cascades onto FIC-201, which reads FT-201.</desc>
  <defs>
    <style>
      .sheet { fill: #ffffff; }
      .frame { fill: none; stroke: #1c2730; stroke-width: 3; }
      .tick { stroke: #1c2730; stroke-width: 2; }
      .pipe { fill: none; stroke: #1c2730; stroke-width: 3.5; }
      .heavy { fill: none; stroke: #1c2730; stroke-width: 6; }
      .signal { fill: none; stroke: #1c2730; stroke-width: 2; stroke-dasharray: 12 8; }
      .sym { fill: #ffffff; stroke: #1c2730; stroke-width: 3; }
      .thin { fill: none; stroke: #1c2730; stroke-width: 2; }
      .nll { fill: none; stroke: #1c2730; stroke-width: 2; stroke-dasharray: 24 9 5 9; }
      .tag { fill: #101820; font-size: 38px; font-weight: 700; text-anchor: middle; }
      .name { fill: #33414d; font-size: 34px; text-anchor: middle; }
      .bubble { fill: #101820; font-size: 33px; font-weight: 700; text-anchor: middle; }
      .line-no { fill: #33414d; font-size: 33px; }
      .small { fill: #101820; font-size: 33px; font-weight: 600; text-anchor: middle; }
      .key { fill: #33414d; font-size: 33px; }
      .title { fill: #101820; font-size: 36px; font-weight: 700; }
      .live-value { fill: #101820; font-size: 30px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="flow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#1c2730"/></marker>
    <g id="gate"><path class="sym" d="M-20 -14 L20 14 V-14 L-20 14 Z"/></g>
    <g id="gate-v"><path class="sym" d="M-14 -20 L14 20 H-14 L14 -20 Z"/></g>
  </defs>

  <rect class="sheet" x="0" y="0" width="2800" height="1000"/>
  <rect class="frame" x="16" y="16" width="2768" height="968"/>
  <path class="tick" d="M556 16 V30 M1110 16 V30 M1664 16 V30 M2218 16 V30 M556 984 V970 M1110 984 V970 M1664 984 V970 M2218 984 V970 M16 258 H30 M16 500 H30 M16 742 H30 M2784 258 H2770 M2784 500 H2770 M2784 742 H2770"/>

