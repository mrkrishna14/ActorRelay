    <path class="pipe" d="M1720 112 V260"/>
    <path class="pipe" d="M1720 340 V500 H1170"/>
    <path class="pipe" d="M1170 660 H1586"/>
    <path class="pipe" d="M1654 660 H1990" marker-end="url(#flow)"/>
    <path class="pipe" d="M250 690 H358"/>
