<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ActorRelay — three-slide presentation</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111a;color:#e8f2f6;font-family:Segoe UI,Arial,sans-serif}main{height:calc(100vh - 64px);display:grid;place-items:center;padding:12px}.slide{display:none;width:100%;height:100%;object-fit:contain}.slide.active{display:block}nav{height:64px;display:flex;align-items:center;justify-content:center;gap:20px;border-top:1px solid #2a4455}button,a{font:16px Segoe UI,Arial,sans-serif;border:1px solid #35586e;color:#91d3e8;background:#142b39;padding:8px 18px;border-radius:4px;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #dfbd78;outline-offset:3px}span{color:#9bb3c3}button:disabled{opacity:.35}body:fullscreen main{height:100vh}body:fullscreen nav{position:fixed;bottom:8px;left:20%;right:20%;height:45px;border:0;opacity:0}body:fullscreen nav:hover,body:fullscreen nav:focus-within{opacity:1}@media print{@page{size:landscape;margin:0}main{display:block;height:auto;padding:0}.slide{display:block;width:100%;height:100vh;break-after:page;object-fit:contain}nav{display:none}}
</style></head><body><main aria-label="Presentation slides"><img class="slide active" src="output/slide-1.png" alt="Slide 1. One pump change affects the whole plant. Equipment is connected. Decisions often are not. More feed from P-100 affects TK-101 level and temperature, LV-101 headroom, and TV-101 steam demand. Isolated agents miss downstream effects. Forgotten incidents get repeated."><img class="slide" src="output/slide-2.png" alt="Slide 2. Negotiate, remember, refuse, across plants. Every component gets an agent and durable memory. Refuse: on an 85 percent request, LV-101 votes no and cites past runs. Negotiate: on a 65 percent counter, all voters agree, then a 10-second veto. Remember: 85 percent again is blocked, citing the run just executed. Across plants: Plant B refuses using Plant A's learned rule. No setpoint changes unless the connected components agree. Target demo flow on a simulated plant, not a measured result."><img class="slide" src="output/slide-3.png" alt="Slide 3. Memory enforces. Messaging negotiates. Durable Actors: one per component, holding memory, limits, and calibration, and serializing each actor's writes. Agent Relay carries votes, evidence, and counter-proposals between components, and learned rules across plants. Digital twins predict. ActorRelay makes the components negotiate, remember, and refuse, across every plant you own."></main><nav aria-label="Slide controls"><button id="prev" aria-label="Previous slide">← Previous</button><span id="count" aria-live="polite">1 / 3</span><button id="next" aria-label="Next slide">Next →</button><button id="full">Fullscreen</button><a href="output/ActorRelay.pptx" download>Download PPTX</a></nav><script>
let index=0;const slides=[...document.querySelectorAll('.slide')];function show(i){index=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle('active',n===index));document.querySelector('#count').textContent=`${index+1} / ${slides.length}`;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===slides.length-1;location.hash=`slide-${index+1}`}document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement)document.body.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(2)});show(Number(location.hash.match(/slide-(\d)/)?.[1]??1)-1);
</script></body></html>
